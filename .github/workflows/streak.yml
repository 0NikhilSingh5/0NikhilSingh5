# Renders the streak card in assets/streak.svg from the contribution calendar.
# Runs once a day, on every push to main, and by hand from the Actions tab.
# The README points at the raw file, so the card cannot go stale behind a third-party cache.
# Set a STREAK_TOKEN secret (a token owned by this account) if the default GITHUB_TOKEN
# ever reports fewer contributions than the profile graph.
name: streak

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Render the card
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/streak.py

      - name: Commit the card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update streak card"
          git push
